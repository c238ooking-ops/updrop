name: Unzip & Upload to uDrop

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct HTTPS URL (Pixeldrain, R2, direct ZIP, etc.)'
        required: true
      account_target:
        description: 'Choose target uDrop Account'
        required: true
        default: 'Account 2 (Secondary)'
        type: choice
        options:
          - 'Account 1 (Primary)'
          - 'Account 2 (Secondary)'
          - 'Account 3'
          - 'Account 4'
          - 'Account 5'
      folder_name:
        description: 'Folder Name (Finds existing or creates automatically; leave blank for root)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  unzip_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Free Up Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 wget
          pip install requests

      - name: Download, Extract, Auto-Folder & Upload
        env:
          FILE_URL: ${{ inputs.file_url }}
          TARGET_ACC: ${{ inputs.account_target }}
          FOLDER_NAME: ${{ inputs.folder_name }}
          ACCOUNTS_JSON: ${{ secrets.UDROP_ACCOUNTS_JSON }}
          FALLBACK_KEY1: ${{ secrets.UDROP_KEY1 }}
          FALLBACK_KEY2: ${{ secrets.UDROP_KEY2 }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import re
          import zipfile
          import requests

          FILE_URL = os.environ.get("FILE_URL", "").strip()
          TARGET_ACC = os.environ.get("TARGET_ACC", "Account 1 (Primary)").strip()
          FOLDER_NAME = os.environ.get("FOLDER_NAME", "").strip()
          ACCOUNTS_RAW = os.environ.get("ACCOUNTS_JSON", "").strip()

          API_BASE = "https://www.udrop.com/api/v2"

          # 1. PARSE KEYS FROM JSON BY NAME OR INDEX
          key1 = None
          key2 = None

          # Map dropdown selection to array index
          acc_index_map = {
              "account 1 (primary)": 0,
              "account 2 (secondary)": 1,
              "account 3": 2,
              "account 4": 3,
              "account 5": 4
          }
          target_idx = acc_index_map.get(TARGET_ACC.lower(), 0)

          if ACCOUNTS_RAW:
              try:
                  acc_data = json.loads(ACCOUNTS_RAW)
                  if isinstance(acc_data, list):
                      # Try matching by index first
                      if target_idx < len(acc_data):
                          key1 = acc_data[target_idx].get("key1")
                          key2 = acc_data[target_idx].get("key2")
                          acc_name = acc_data[target_idx].get("name", f"Index {target_idx}")
                          print(f"🎯 Selected account by position [{target_idx}]: '{acc_name}'")
                      
                      # If not found by index, fuzzy match by name
                      if not key1:
                          for a in acc_data:
                              name = str(a.get("name", "")).lower()
                              if ("second" in TARGET_ACC.lower() and "second" in name) or \
                                 ("primary" in TARGET_ACC.lower() and "primary" in name):
                                  key1 = a.get("key1")
                                  key2 = a.get("key2")
                                  print(f"🎯 Matched account by name: '{a.get('name')}'")
                                  break
              except Exception as e:
                  print(f"⚠️ Failed to parse UDROP_ACCOUNTS_JSON: {e}")

          if not key1 or not key2:
              print(f"⚠️ Falling back to default UDROP_KEY1/KEY2 secrets...")
              key1 = os.environ.get("FALLBACK_KEY1")
              key2 = os.environ.get("FALLBACK_KEY2")

          if not key1 or not key2:
              raise Exception(f"❌ Missing API credentials for {TARGET_ACC}!")

          # 2. AUTHENTICATE
          print(f"🔑 Authenticating with uDrop...")
          auth_res = requests.post(f"{API_BASE}/authorize", data={"key1": key1, "key2": key2})
          auth_data = auth_res.json()

          if auth_data.get("_status") != "success":
              raise Exception(f"Authentication Failed: {auth_data.get('response', 'Unknown Error')}")

          access_token = auth_data["data"]["access_token"]
          account_id = auth_data["data"]["account_id"]
          print(f"✅ Authenticated as Account ID: {account_id}")

          # 3. AUTO FIND OR CREATE FOLDER
          final_folder_id = ""
          if FOLDER_NAME:
              print(f"📁 Checking folder: '{FOLDER_NAME}'...")
              list_res = requests.post(
                  f"{API_BASE}/folder/list",
                  data={"access_token": access_token, "account_id": account_id}
              )
              list_json = list_res.json()
              existing_id = None

              if list_json.get("_status") == "success" and list_json.get("data"):
                  for f in list_json["data"]:
                      if str(f.get("folder_name", "")).strip().lower() == FOLDER_NAME.lower():
                          existing_id = f.get("folder_id") or f.get("id")
                          break

              if existing_id:
                  final_folder_id = str(existing_id)
                  print(f"✅ Found existing folder! ID: {final_folder_id}")
              else:
                  print(f"📂 Creating folder '{FOLDER_NAME}'...")
                  create_res = requests.post(
                      f"{API_BASE}/folder/create",
                      data={
                          "access_token": access_token,
                          "account_id": account_id,
                          "folder_name": FOLDER_NAME,
                          "parent_id": ""
                      }
                  )
                  create_json = create_res.json()
                  if create_json.get("_status") == "success" and create_json.get("data"):
                      data_obj = create_json["data"]
                      final_folder_id = str(data_obj.get("folder_id") or data_obj.get("id"))
                      print(f"✅ Created folder successfully! ID: {final_folder_id}")
                  else:
                      print(f"⚠️ Failed to create folder. Using root folder.")
                      final_folder_id = ""

          # 4. RESOLVE PIXELDRAIN & DIRECT DOWNLOAD LINKS
          download_url = FILE_URL

          # Convert pixeldrain viewer link /u/ID to direct API link /api/file/ID
          pixeldrain_match = re.search(r'pixeldrain\.(?:dev|com)/u/([a-zA-Z0-9_-]+)', download_url)
          if pixeldrain_match:
              file_id = pixeldrain_match.group(1)
              download_url = f"https://pixeldrain.com/api/file/{file_id}"
              print(f"🔗 Converted Pixeldrain URL to direct API: {download_url}")

          print("\n📥 Downloading file...")
          # Try wget with resume and full redirect support first, then aria2c fallback
          dl_cmd = (
              f'wget -c --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64)" '
              f'--content-disposition -O "downloaded_file" "{download_url}" || '
              f'aria2c -x 16 -s 16 -k 2M --file-allocation=none '
              f'--header="User-Agent: Mozilla/5.0" -o "downloaded_file" "{download_url}"'
          )
          if os.system(dl_cmd) != 0:
              raise Exception("Failed to download file.")

          # Check if the downloaded file is a ZIP archive or a direct video
          os.makedirs("ready_to_upload", exist_ok=True)
          is_zip = zipfile.is_zipfile("downloaded_file")

          if is_zip:
              print("📦 Valid ZIP detected. Extracting...")
              with zipfile.ZipFile("downloaded_file", "r") as zip_ref:
                  zip_ref.extractall("ready_to_upload")
              os.remove("downloaded_file")
          else:
              print("🎬 Direct video or single file detected (not a zip). Preparing for direct upload...")
              # Infer extension or fallback to .mkv
              dest_name = "video.mkv"
              if "." in FILE_URL.split("/")[-1]:
                  cleaned_name = FILE_URL.split("/")[-1].split("?")[0]
                  if cleaned_name:
                      dest_name = cleaned_name
              os.rename("downloaded_file", os.path.join("ready_to_upload", dest_name))

          video_exts = ('.mp4', '.mkv', '.avi', '.webm', '.ts')
          upload_files = []
          for root, _, files in os.walk("ready_to_upload"):
              for file in files:
                  if file.lower().endswith(video_exts):
                      upload_files.append(os.path.join(root, file))

          print(f"🎬 Found {len(upload_files)} media file(s) ready for upload.")
          if not upload_files:
              print("⚠️ No video files found to upload.")
              sys.exit(0)

          # 5. UPLOAD TO UDROP
          print(f"\n🚀 Uploading files to uDrop...")
          ready_links = []

          for file_path in sorted(upload_files):
              filename = os.path.basename(file_path)
              print(f"Uploading: {filename}...")

              with open(file_path, "rb") as f:
                  form_data = {
                      "access_token": access_token,
                      "account_id": account_id,
                  }
                  if final_folder_id:
                      form_data["folder_id"] = final_folder_id

                  files_payload = {
                      "upload_file": (filename, f)
                  }

                  upload_res = requests.post(f"{API_BASE}/file/upload", data=form_data, files=files_payload)
                  try:
                      res_json = upload_res.json()
                  except Exception:
                      print(f"  ❌ Invalid response: {upload_res.text[:200]}")
                      continue

                  if res_json.get("_status") == "success" and res_json.get("data"):
                      data_obj = res_json["data"]
                      file_meta = data_obj[0] if isinstance(data_obj, list) else data_obj

                      short_url = file_meta.get("short_url") or file_meta.get("shortUrl")
                      if short_url:
                          direct_link = f"https://www.udrop.com/file/{short_url}/{filename}"
                      else:
                          direct_link = file_meta.get("url") or file_meta.get("download_url")

                      print(f"  -> Uploaded: {direct_link}")
                      ready_links.append(direct_link)
                  else:
                      print(f"  ❌ Failed: {res_json.get('response', 'Upload error')}")

          # 6. PRINT LINKS
          print("\n" + "="*50)
          print("📋 DIRECT STREAM / DOWNLOAD LINKS:")
          print("="*50)
          print("\n".join(ready_links))
          EOF
