name: Unzip & Upload to uDrop

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct HTTPS URL (Skydrop, Pixeldrain, R2, direct ZIP, etc.)'
        required: true
      account_number:
        description: 'Account Number in JSON list (e.g. 1, 2, 3, 10, 11)'
        required: true
        default: '2'
      folder_path:
        description: 'Folder Path (e.g. "m2/series/2 broke girls season 05"; leave blank for root)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  unzip_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Free Up Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install System Tools & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aria2 wget curl
          pip install --no-cache-dir requests requests-toolbelt yt-dlp playwright

      - name: Install Playwright Browser (Conditional)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium --with-deps

      - name: Download, Extract, Resolve Path & Upload
        env:
          FILE_URL: ${{ inputs.file_url }}
          ACCOUNT_NUM: ${{ inputs.account_number }}
          FOLDER_PATH: ${{ inputs.folder_path }}
          ACCOUNTS_JSON: ${{ secrets.UDROP_ACCOUNTS_JSON }}
          FALLBACK_KEY1: ${{ secrets.UDROP_KEY1 }}
          FALLBACK_KEY2: ${{ secrets.UDROP_KEY2 }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import re
          import zipfile
          import asyncio
          import requests
          from playwright.async_api import async_playwright

          FILE_URL = os.environ.get("FILE_URL", "").strip()
          ACCOUNT_RAW_NUM = os.environ.get("ACCOUNT_NUM", "1").strip()
          FOLDER_PATH = os.environ.get("FOLDER_PATH", "").strip()
          ACCOUNTS_RAW = os.environ.get("ACCOUNTS_JSON", "").strip()

          API_BASE = "https://www.udrop.com/api/v2"

          # 1. PARSE KEYS DYNAMICALLY BY ACCOUNT NUMBER
          key1, key2 = None, None

          try:
              target_idx = max(0, int(ACCOUNT_RAW_NUM) - 1)
          except ValueError:
              target_idx = 0

          if ACCOUNTS_RAW:
              try:
                  acc_data = json.loads(ACCOUNTS_RAW)
                  if isinstance(acc_data, list) and target_idx < len(acc_data):
                      selected = acc_data[target_idx]
                      key1 = selected.get("key1")
                      key2 = selected.get("key2")
              except Exception:
                  pass

          if not key1 or not key2:
              key1 = os.environ.get("FALLBACK_KEY1")
              key2 = os.environ.get("FALLBACK_KEY2")

          if not key1 or not key2:
              raise Exception("❌ Missing API credentials!")

          # 2. AUTHENTICATE
          auth_res = requests.post(f"{API_BASE}/authorize", data={"key1": key1, "key2": key2})
          auth_data = auth_res.json()
          if auth_data.get("_status") != "success":
              raise Exception(f"Auth failed: {auth_data.get('response')}")

          access_token = auth_data["data"]["access_token"]
          account_id = auth_data["data"]["account_id"]
          print(f"✅ Authenticated! Account ID: {account_id}")

          # 3. FOLDER RESOLUTION
          target_folder_id = ""
          if FOLDER_PATH:
              if FOLDER_PATH.strip().isdigit():
                  target_folder_id = FOLDER_PATH.strip()
              else:
                  segments = [s.strip() for s in re.split(r'[\\/]+', FOLDER_PATH) if s.strip()]
                  current_parent_id = ""
                  for segment in segments:
                      list_payload = {"access_token": access_token, "account_id": account_id}
                      if current_parent_id:
                          list_payload["parent_folder_id"] = str(current_parent_id)

                      listing_res = requests.post(f"{API_BASE}/folder/listing", data=list_payload).json()
                      folders_list = listing_res.get("data", {}).get("folders", []) if isinstance(listing_res.get("data"), dict) else listing_res.get("data", [])

                      found_id = None
                      for f in folders_list:
                          if f.get("status") != "trash" and str(f.get("folderName", "")).strip().lower() == segment.lower():
                              found_id = str(f.get("id"))
                              break

                      if not found_id:
                          create_payload = {"access_token": access_token, "account_id": account_id, "folder_name": segment, "is_public": 1}
                          if current_parent_id:
                              create_payload["parent_id"] = str(current_parent_id)
                          create_res = requests.post(f"{API_BASE}/folder/create", data=create_payload).json()
                          if create_res.get("_status") == "success" and create_res.get("data"):
                              found_id = str(create_res["data"].get("id") or create_res["data"].get("folder_id"))
                      current_parent_id = found_id
                  target_folder_id = current_parent_id or ""

          print(f"🎯 Target Folder ID: {target_folder_id or 'Root'}")

          # 4. DOWNLOAD HANDLING WITH PLAYWRIGHT FILENAME CAPTURE
          download_filename = "downloaded_payload"
          final_saved_filename = "video.mkv"

          async def download_skydrop(url):
              global final_saved_filename
              print("🌐 Skydrop link detected. Launching automated headless browser...")
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(accept_downloads=True)
                  page = await context.new_page()
                  
                  await page.goto(url, wait_until="networkidle")
                  try:
                      download_btn = page.locator("a:has-text('Download Video'), button:has-text('Download Video')")
                      await download_btn.wait_for(state="visible", timeout=20000)
                      
                      async with page.expect_download(timeout=60000) as download_info:
                          await download_btn.first.click()
                      
                      download = await download_info.value
                      final_saved_filename = download.suggested_filename
                      await download.save_as(download_filename)
                      print(f"🎉 Successfully downloaded via Playwright: {final_saved_filename}")
                  except Exception as e:
                      raise Exception(f"❌ Playwright download failed for Skydrop: {e}")
                  finally:
                      await browser.close()

          download_url = FILE_URL
          pixeldrain_match = re.search(r'pixeldrain\.(?:dev|com)/u/([a-zA-Z0-9_-]+)', download_url)
          if pixeldrain_match:
              download_url = f"https://pixeldrain.com/api/file/{pixeldrain_match.group(1)}"

          if "skydrop" in download_url:
              asyncio.run(download_skydrop(download_url))
          else:
              dl_cmd = f'aria2c -x 16 -s 16 -k 2M --file-allocation=none -o "{download_filename}" "{download_url}"'
              if os.system(dl_cmd) != 0 or not os.path.exists(download_filename):
                  raise Exception("❌ Standard download failed.")
              raw_name = download_url.split("/")[-1].split("?")[0]
              if "." in raw_name:
                  final_saved_filename = raw_name

          # Size Guard (5 GB limit)
          MAX_UDROP_BYTES = 5 * 1024 * 1024 * 1024
          downloaded_size = os.path.getsize(download_filename)
          if not zipfile.is_zipfile(download_filename) and downloaded_size > MAX_UDROP_BYTES:
              raise Exception(f"❌ File size exceeds uDrop's 5.0 GB limit.")

          # 5. UNPACK OR RENAME
          os.makedirs("ready_to_upload", exist_ok=True)
          if zipfile.is_zipfile(download_filename):
              with zipfile.ZipFile(download_filename, "r") as zip_ref:
                  zip_ref.extractall("ready_to_upload")
              os.remove(download_filename)
          else:
              os.rename(download_filename, os.path.join("ready_to_upload", final_saved_filename))

          video_exts = ('.mp4', '.mkv', '.avi', '.webm', '.ts')
          upload_files = []
          for root, _, files in os.walk("ready_to_upload"):
              for file in files:
                  if file.lower().endswith(video_exts):
                      upload_files.append(os.path.join(root, file))

          print(f"🎬 Found {len(upload_files)} media item(s): {[os.path.basename(f) for f in upload_files]}")
          if not upload_files:
              sys.exit(0)

          # 6. STREAMED UPLOAD
          import time
          from requests_toolbelt.multipart.encoder import MultipartEncoder

          ready_links = []
          session = requests.Session()

          for file_path in sorted(upload_files):
              filename = os.path.basename(file_path)
              filesize_mb = round(os.path.getsize(file_path) / (1024 * 1024), 2)
              print(f"\n🚀 Uploading: {filename} ({filesize_mb} MB)...")

              fields = {"access_token": access_token, "account_id": str(account_id)}
              if target_folder_id:
                  fields["folder_id"] = str(target_folder_id)

              for attempt in range(1, 4):
                  try:
                      with open(file_path, "rb") as f:
                          fields_copy = fields.copy()
                          fields_copy["upload_file"] = (filename, f, "application/octet-stream")
                          m = MultipartEncoder(fields=fields_copy)
                          headers = {"Content-Type": m.content_type, "User-Agent": "Mozilla/5.0"}

                          upload_res = session.post(f"{API_BASE}/file/upload", data=m, headers=headers, timeout=(30, 1800))
                          res_json = upload_res.json()

                          if res_json.get("_status") == "success" and res_json.get("data"):
                              data_obj = res_json["data"]
                              file_meta = data_obj[0] if isinstance(data_obj, list) else data_obj
                              short_url = file_meta.get("short_url") or file_meta.get("shortUrl")
                              link = f"https://www.udrop.com/file/{short_url}/{filename}" if short_url else (file_meta.get("url") or "")
                              print(f"  -> Uploaded: {link}")
                              ready_links.append(link)
                              break
                  except Exception as e:
                      print(f"  ⚠️ Attempt {attempt} error: {e}")
                      time.sleep(5)

          print("\n" + "="*50)
          print("📋 DIRECT STREAM / DOWNLOAD LINKS:")
          print("="*50)
          print("\n".join(ready_links))
          EOF
