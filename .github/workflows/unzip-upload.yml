name: Unzip & Upload to uDrop

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct HTTPS URL (Pixeldrain, R2, direct ZIP, etc.)'
        required: true
      account_number:
        description: 'Account Number in JSON list (e.g. 1, 2, 3, 10, 11)'
        required: true
        default: '2'
      folder_path:
        description: 'Folder Path (e.g. "m2/series/2 broke girls season 05"; leave blank for root)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  unzip_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Free Up Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Tools & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aria2 wget
          pip install --no-cache-dir requests

      - name: Download, Extract, Resolve Path & Upload
        env:
          FILE_URL: ${{ inputs.file_url }}
          ACCOUNT_NUM: ${{ inputs.account_number }}
          FOLDER_PATH: ${{ inputs.folder_path }}
          ACCOUNTS_JSON: ${{ secrets.UDROP_ACCOUNTS_JSON }}
          FALLBACK_KEY1: ${{ secrets.UDROP_KEY1 }}
          FALLBACK_KEY2: ${{ secrets.UDROP_KEY2 }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import re
          import zipfile
          import requests

          FILE_URL = os.environ.get("FILE_URL", "").strip()
          ACCOUNT_RAW_NUM = os.environ.get("ACCOUNT_NUM", "1").strip()
          FOLDER_PATH = os.environ.get("FOLDER_PATH", "").strip()
          ACCOUNTS_RAW = os.environ.get("ACCOUNTS_JSON", "").strip()

          API_BASE = "https://www.udrop.com/api/v2"

          # 1. PARSE KEYS DYNAMICALLY BY ACCOUNT NUMBER
          key1, key2 = None, None

          # Convert human-readable 1-based number (1, 2, 10...) to 0-based index
          try:
              target_idx = max(0, int(ACCOUNT_RAW_NUM) - 1)
          except ValueError:
              print(f"⚠️ Invalid number '{ACCOUNT_RAW_NUM}', defaulting to Account 1")
              target_idx = 0

          if ACCOUNTS_RAW:
              try:
                  acc_data = json.loads(ACCOUNTS_RAW)
                  if isinstance(acc_data, list):
                      if target_idx < len(acc_data):
                          selected = acc_data[target_idx]
                          key1 = selected.get("key1")
                          key2 = selected.get("key2")
                          acc_name = selected.get("name", f"Account {target_idx + 1}")
                          print(f"🎯 Selected Account #{ACCOUNT_RAW_NUM} (Index [{target_idx}]): '{acc_name}'")
                      else:
                          print(f"⚠️ Account #{ACCOUNT_RAW_NUM} exceeds total accounts ({len(acc_data)}) in JSON!")
              except Exception as e:
                  print(f"⚠️ JSON parse error: {e}")

          if not key1 or not key2:
              print("⚠️ Falling back to default repository secrets UDROP_KEY1 / UDROP_KEY2...")
              key1 = os.environ.get("FALLBACK_KEY1")
              key2 = os.environ.get("FALLBACK_KEY2")

          if not key1 or not key2:
              raise Exception(f"❌ Missing API credentials for Account #{ACCOUNT_RAW_NUM}!")

          # 2. AUTHENTICATE
          auth_res = requests.post(f"{API_BASE}/authorize", data={"key1": key1, "key2": key2})
          auth_data = auth_res.json()
          if auth_data.get("_status") != "success":
              raise Exception(f"Auth failed: {auth_data.get('response')}")

          access_token = auth_data["data"]["access_token"]
          account_id = auth_data["data"]["account_id"]
          print(f"✅ Authenticated! Account ID: {account_id}")

          # 3. ROBUST FOLDER RESOLUTION & CREATION (Matches by Name across Account)
          target_folder_id = ""
          if FOLDER_PATH:
              if FOLDER_PATH.strip().isdigit():
                  target_folder_id = FOLDER_PATH.strip()
                  print(f"🎯 Direct Numeric Folder ID: {target_folder_id}")
              else:
                  segments = [s.strip() for s in re.split(r'[\\/]+', FOLDER_PATH) if s.strip()]
                  print(f"📂 Resolving nested path: {' ➔ '.join(segments)}")

                  current_folder_id = ""

                  for segment in segments:
                      listing_res = requests.post(
                          f"{API_BASE}/folder/listing",
                          data={"access_token": access_token, "account_id": account_id}
                      ).json()

                      folders_list = []
                      if listing_res.get("_status") == "success" and listing_res.get("data"):
                          data_node = listing_res["data"]
                          if isinstance(data_node, dict):
                              folders_list = data_node.get("folders", [])
                          elif isinstance(data_node, list):
                              folders_list = data_node

                      found_id = None
                      # Match folder by name (case-insensitive), skipping trashed folders
                      for f in folders_list:
                          if f.get("status") == "trash":
                              continue

                          if str(f.get("folderName", "")).strip().lower() == segment.lower():
                              found_id = str(f.get("id"))
                              print(f"  📁 Found existing folder: '{f.get('folderName')}' (ID: {found_id})")
                              break

                      if not found_id:
                          print(f"  📂 Folder '{segment}' not found. Creating it...")
                          create_payload = {
                              "access_token": access_token,
                              "account_id": account_id,
                              "folder_name": segment
                          }
                          create_res = requests.post(f"{API_BASE}/folder/create", data=create_payload).json()
                          if create_res.get("_status") == "success" and create_res.get("data"):
                              data_obj = create_res["data"]
                              found_id = str(data_obj.get("folder_id") or data_obj.get("id"))
                              print(f"  ✅ Created '{segment}' (ID: {found_id})")
                          else:
                              print(f"  ⚠️ Failed creating folder '{segment}'.")
                              break

                      current_folder_id = found_id

                  target_folder_id = current_folder_id

          print(f"🎯 Final Target Upload Folder ID: {target_folder_id or 'Root'}")

          # 4. RESOLVE LINK & 16-CONNECTION ACCELERATED DOWNLOAD
          download_url = FILE_URL
          pixeldrain_match = re.search(r'pixeldrain\.(?:dev|com)/u/([a-zA-Z0-9_-]+)', download_url)
          if pixeldrain_match:
              download_url = f"https://pixeldrain.com/api/file/{pixeldrain_match.group(1)}"
              print(f"🔗 Converted Pixeldrain URL: {download_url}")

          print("\n📥 Starting 16-connection multi-stream download via aria2c...")
          dl_cmd = (
              f'aria2c '
              f'-x 16 '
              f'-s 16 '
              f'-j 16 '
              f'-k 2M '
              f'--min-split-size=2M '
              f'--stream-piece-selector=geom '
              f'--max-connection-per-server=16 '
              f'--file-allocation=none '
              f'--summary-interval=30 '
              f'--console-log-level=warn '
              f'--header="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" '
              f'-o "downloaded_payload" "{download_url}" || '
              f'wget -c -q --show-progress --progress=dot:giga '
              f'--user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64)" '
              f'--content-disposition -O "downloaded_payload" "{download_url}"'
          )
          if os.system(dl_cmd) != 0:
              raise Exception("Failed to download payload.")

          # 5. UNPACK OR RENAME
          os.makedirs("ready_to_upload", exist_ok=True)
          if zipfile.is_zipfile("downloaded_payload"):
              print("📦 Valid archive found. Extracting files...")
              with zipfile.ZipFile("downloaded_payload", "r") as zip_ref:
                  zip_ref.extractall("ready_to_upload")
              os.remove("downloaded_payload")
          else:
              print("🎬 Direct file found. Moving to upload queue...")
              dest_name = "video.mkv"
              raw_name = FILE_URL.split("/")[-1].split("?")[0]
              if "." in raw_name:
                  dest_name = raw_name
              os.rename("downloaded_payload", os.path.join("ready_to_upload", dest_name))

          video_exts = ('.mp4', '.mkv', '.avi', '.webm', '.ts')
          upload_files = []
          for root, _, files in os.walk("ready_to_upload"):
              for file in files:
                  if file.lower().endswith(video_exts):
                      upload_files.append(os.path.join(root, file))

          print(f"🎬 Found {len(upload_files)} media item(s).")
          if not upload_files:
              sys.exit(0)

          # 6. UPLOAD TO TARGET FOLDER
          print(f"\n🚀 Uploading items...")
          ready_links = []
          for file_path in sorted(upload_files):
              filename = os.path.basename(file_path)
              print(f"Uploading: {filename}...")

              with open(file_path, "rb") as f:
                  form_data = {"access_token": access_token, "account_id": account_id}
                  if target_folder_id:
                      form_data["folder_id"] = str(target_folder_id)

                  upload_res = requests.post(f"{API_BASE}/file/upload", data=form_data, files={"upload_file": (filename, f)})
                  try:
                      res_json = upload_res.json()
                  except Exception:
                      continue

                  if res_json.get("_status") == "success" and res_json.get("data"):
                      data_obj = res_json["data"]
                      file_meta = data_obj[0] if isinstance(data_obj, list) else data_obj
                      short_url = file_meta.get("short_url") or file_meta.get("shortUrl")
                      link = f"https://www.udrop.com/file/{short_url}/{filename}" if short_url else (file_meta.get("url") or "")
                      print(f"  -> Uploaded: {link}")
                      ready_links.append(link)
                  else:
                      print(f"  ❌ Upload failed: {res_json.get('response')}")

          # 7. SUMMARY
          print("\n" + "="*50)
          print("📋 DIRECT STREAM / DOWNLOAD LINKS:")
          print("="*50)
          print("\n".join(ready_links))
          EOF
