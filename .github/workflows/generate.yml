name: Generate Cloudflare Code

on:
  push:
    paths:
      - 'links.txt'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Generator
        run: node generate.js

      - name: Commit Generated File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloudflare_code.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Cloudflare code block" && git push)
