name: Auto Sync uDrop Library

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Auto Sync
        env:
          UDROP_ACCOUNTS_JSON: ${{ secrets.UDROP_ACCOUNTS_JSON }}
          UDROP_KEY1: ${{ secrets.UDROP_KEY1 }}
          UDROP_KEY2: ${{ secrets.UDROP_KEY2 }}
          UDROP_FOLDER_ID: ${{ secrets.UDROP_FOLDER_ID }}
          NODE_OPTIONS: "--no-warnings"
        run: node generate.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add database.json
          
          # Only commit and push if database.json actually changed
          if git diff --staged --quiet; then
            echo "No changes in database.json. Skipping commit."
          else
            git commit -m "Auto-update database.json [skip ci]"
            git push
          fi
