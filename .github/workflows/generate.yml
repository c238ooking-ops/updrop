name: Auto Sync uDrop Library

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch:      # Allows manual one-click sync button

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Auto Sync
        env:
          UDROP_KEY1: ${{ secrets.UDROP_KEY1 }}
          UDROP_KEY2: ${{ secrets.UDROP_KEY2 }}
        run: node generate.js

      - name: Commit Database Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-synced uDrop library" && git push)
