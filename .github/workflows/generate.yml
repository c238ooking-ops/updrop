name: Auto Sync uDrop Library

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Auto Sync
        env:
          UDROP_ACCOUNTS_JSON: ${{ secrets.UDROP_ACCOUNTS_JSON }}
          UDROP_KEY1: ${{ secrets.UDROP_KEY1 }}
          UDROP_KEY2: ${{ secrets.UDROP_KEY2 }}
          UDROP_FOLDER_ID: ${{ secrets.UDROP_FOLDER_ID }}
          NODE_OPTIONS: "--no-warnings"
        run: node generate.js

      - name: Push Database Instantly to Cloudflare Worker KV
        run: |
          echo "Pushing database.json to Cloudflare Worker..."
          curl -s -f -X POST "https://gofile-stremio-addon.c238ooking.workers.dev/sync" \
            -H "Content-Type: application/json" \
            -H "x-sync-secret: my_super_secret_sync_key_123" \
            --data-binary @database.json
          echo "✅ KV database synchronized with zero delay!"[cite: 4]

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add database.json
          
          if git diff --staged --quiet; then
            echo "No changes in database.json. Skipping commit."
          else
            git commit -m "Auto-update database.json [skip ci]"
            git push
          fi
