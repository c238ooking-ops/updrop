<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Vault Pro</title>
    <style>
        :root {
            --bg: #0a0a0a; --sidebar: #121212; --card: #1c1c1c; --accent: #00e676; 
            --text: #ffffff; --dim: #888; --border: #2a2a2a; --gold: #ffc107;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: var(--sidebar); padding: 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
        .sidebar h1 { font-size: 1rem; color: var(--accent); letter-spacing: 2px; margin-bottom: 15px; border-left: 3px solid var(--accent); padding-left: 10px; }
        
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #181818; padding: 4px; border-radius: 6px; border: 1px solid var(--border); }
        .nav-tab { flex: 1; background: transparent; border: none; color: var(--dim); padding: 10px 6px; font-size: 0.75rem; font-weight: bold; border-radius: 4px; cursor: pointer; text-align: center; }
        .nav-tab.active { background: var(--accent); color: #000; }

        .config-box { background: #151515; border: 1px solid var(--border); padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.7rem; }
        .config-box input { width: 100%; margin-bottom: 6px; padding: 6px; font-size: 11px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; outline: none; }
        .btn-save-config { background: #333; color: white; border: none; padding: 6px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; }

        .filter-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.6rem; color: var(--dim); text-transform: uppercase; margin-bottom: 4px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 6px; font-size: 14px; outline: none; box-sizing: border-box; }
        #stats { font-size: 0.65rem; color: var(--dim); padding: 10px; background: #1a1a1a; border-radius: 6px; line-height: 1.6; }
        
        .main-content { flex-grow: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 10px 15px; border-right: none; border-bottom: 1px solid var(--border); }
            .sidebar h1 { display: none; }
            .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .main-content { padding: 10px; }
        }
        
        .movie-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); position: relative; cursor: pointer; transition: transform 0.2s; }
        .movie-card:hover { transform: scale(1.02); }
        .poster-container { width: 100%; aspect-ratio: 2 / 3; background: #1a1a1a; }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; }
        .movie-info { padding: 8px; position: relative; }
        .movie-info h3 { font-size: 0.75rem; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .year-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); font-size: 0.6rem; padding: 2px 5px; border-radius: 4px; }
        .owned-dot { position: absolute; top: 8px; left: 8px; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }
        
        #browseView { display: flex; flex-direction: column; flex-grow: 1; }
        .browse-header-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .browse-header-row input { flex-grow: 1; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 1rem; }
        .btn-search-exec { background: var(--accent); color: #000; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .modal-subbar { padding: 10px 15px; background: #151515; border: 1px solid var(--border); border-radius: 8px; display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        .tab-btn { background: #222; border: 1px solid var(--border); color: var(--dim); padding: 5px 12px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        /* Streams Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 600px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 0.9rem; margin: 0; color: var(--accent); }
        .modal-close { background: none; border: none; color: var(--dim); font-size: 1.2rem; cursor: pointer; }
        .modal-body { padding: 15px 20px; overflow-y: auto; flex-grow: 1; }
        
        .stream-item { background: #151515; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .stream-details { font-size: 0.75rem; overflow: hidden; }
        .stream-title { font-weight: bold; margin-bottom: 4px; color: var(--text); }
        .stream-meta { color: var(--dim); font-size: 0.65rem; }
        .btn-stream { background: var(--accent); color: #000; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 0.7rem; flex-shrink: 0; display: inline-block; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Vault Pro</h1>
        
        <div class="config-box">
            <label>TMDB API Key (Free)</label>
            <input type="text" id="tmdbKeyInput" placeholder="Enter TMDB v3 Key">
            <button class="btn-save-config" onclick="saveConfig()">Save Settings</button>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" id="tabOwned" onclick="switchTab('owned')">✅ Owned Vault</button>
            <button class="nav-tab" id="tabBrowse" onclick="switchTab('browse')">🔥 Browse TMDB</button>
        </div>

        <div id="ownedFilters">
            <div class="filter-group"><label>Search Vault</label><input type="text" id="searchBox" onkeyup="updateOwnedUI()" placeholder="Title..."></div>
        </div>

        <div style="margin-top: auto;">
            <span id="stats">Ready</span>
        </div>
    </div>

    <div class="main-content">
        <!-- Owned View (Loads from database.json) -->
        <div id="ownedView" style="display:flex; flex-direction: column; flex-grow: 1; overflow-y: auto;">
            <div id="movieGrid" class="movie-grid"></div>
        </div>

        <!-- Browse View (TMDB Trending & Search) -->
        <div id="browseView" style="display:none;">
            <div class="browse-header-row">
                <input type="text" id="browseInput" placeholder="Search movies or shows..." onkeypress="if(event.key === 'Enter') searchTMDB()">
                <button class="btn-search-exec" onclick="searchTMDB()">Search</button>
            </div>
            <div class="modal-subbar">
                <span style="font-size: 0.65rem; color: var(--dim);">DISCOVER:</span>
                <button class="tab-btn active" id="typeMovie" onclick="switchBrowseType('movie')">🎬 Movies</button>
                <button class="tab-btn" id="typeTv" onclick="switchBrowseType('tv')">📺 TV Shows</button>
            </div>
            <div id="browseResults" class="movie-grid" style="overflow-y: auto; flex-grow: 1;">
                <p style="color: var(--dim); text-align: center; grid-column: 1/-1; margin-top: 40px;">Loading trending releases...</p>
            </div>
        </div>
    </div>

    <!-- Streams Modal for Owned Items -->
    <div id="streamsModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle">Available Streams</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody" class="modal-body">
                <!-- Stream links injected dynamically -->
            </div>
        </div>
    </div>

    <script>
        let ownedDatabase = {};
        let ownedArray = [];
        let browseType = "movie";
        let tmdbKey = localStorage.getItem('tmdb_key') || '';

        document.getElementById('tmdbKeyInput').value = tmdbKey;

        function saveConfig() {
            tmdbKey = document.getElementById('tmdbKeyInput'].value.trim();
            localStorage.setItem('tmdb_key', tmdbKey);
            alert("TMDB Key saved!");
            if(document.getElementById('tabBrowse').classList.contains('active')) {
                loadTrending();
            }
        }

        function switchTab(tab) {
            document.getElementById('tabOwned').className = `nav-tab ${tab === 'owned' ? 'active' : ''}`;
            document.getElementById('tabBrowse').className = `nav-tab ${tab === 'browse' ? 'active' : ''}`;
            document.getElementById('ownedView').style.display = tab === 'owned' ? 'flex' : 'none';
            document.getElementById('browseView').style.display = tab === 'browse' ? 'flex' : 'none';
            document.getElementById('ownedFilters').style.display = tab === 'owned' ? 'block' : 'none';

            if (tab === 'browse' && document.getElementById('browseResults').children.length <= 1) {
                loadTrending();
            }
        }

        // Load database.json on startup
        async function loadOwnedData() {
            try {
                const res = await fetch('database.json');
                ownedDatabase = await res.json();
                
                // Convert object map into an array for easy filtering and rendering
                ownedArray = Object.keys(ownedDatabase).map(id => {
                    const item = ownedDatabase[id];
                    return {
                        id: id,
                        title: item.meta.name,
                        poster: item.meta.poster,
                        type: item.meta.type,
                        streams: item.streams || []
                    };
                });
                
                updateOwnedUI();
            } catch (e) {
                console.error(e);
                document.getElementById('movieGrid').innerHTML = `<p style="color:var(--dim); font-size:0.8rem;">Could not load database.json. Make sure it is in the same directory.</p>`;
            }
        }

        function updateOwnedUI() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            let filtered = ownedArray.filter(m => m.title.toLowerCase().includes(search));
            
            const grid = document.getElementById('movieGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color:var(--dim); font-size:0.8rem;">No items found in your vault database.</p>`;
                document.getElementById('stats').innerText = `Owned Vault: 0 items`;
                return;
            }

            grid.innerHTML = filtered.map(m => `
                <div class="movie-card" onclick="openStreamsModal('${m.id}')">
                    <div class="owned-dot" title="In Vault"></div>
                    <div class="poster-container"><img src="${m.poster && m.poster !== 'N/A' ? m.poster : 'https://via.placeholder.com/150x225?text=No+Poster'}" loading="lazy"></div>
                    <div class="movie-info">
                        <h3>${m.title}</h3>
                        <div style="color:var(--dim); font-size:0.6rem">${m.streams.length} stream(s) available</div>
                    </div>
                </div>
            `).join('');
            document.getElementById('stats').innerText = `Owned Vault: ${ownedArray.length} items`;
        }

        function openStreamsModal(id) {
            const item = ownedDatabase[id];
            if (!item) return;

            const modal = document.getElementById('streamsModal');
            const modalBody = document.getElementById('modalBody');
            document.getElementById('modalTitle').innerText = item.meta.name;

            modalBody.innerHTML = item.streams.map(s => `
                <div class="stream-item">
                    <div class="stream-details">
                        <div class="stream-title">${s.title}</div>
                        <div class="stream-meta">Source: ${s.name} | File: ${s.filename}</div>
                    </div>
                    <a href="${s.url}" target="_blank" class="btn-stream">Play / Open</a>
                </div>
            `).join('');

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('streamsModal').style.display = 'none';
        }

        // TMDB Browse Integration
        async function tmdbFetch(endpoint) {
            let url = `https://api.themoviedb.org/3${endpoint}`;
            if (tmdbKey.length <= 50) {
                url += (url.includes('?') ? '&' : '?') + `api_key=${tmdbKey}`;
            }
            const res = await fetch(url, { headers: { 'Content-Type': 'application/json' } });
            if (!res.ok) throw new Error(`TMDB Error: ${res.status}`);
            return await res.json();
        }

        async function loadTrending() {
            if (!tmdbKey) {
                document.getElementById('browseResults').innerHTML = `<p style="color: var(--dim); text-align: center; grid-column: 1/-1; margin-top: 40px;">Please enter your free TMDB API key in the sidebar to browse trends.</p>`;
                return;
            }
            const resultsContainer = document.getElementById('browseResults');
            resultsContainer.innerHTML = `<p style="color: var(--dim); text-align: center; grid-column: 1/-1; margin-top: 40px;">Loading trending releases...</p>`;
            try {
                const data = await tmdbFetch(`/trending/${browseType}/day`);
                renderTMDBResults(data.results);
            } catch (e) {
                resultsContainer.innerHTML = `<p style="color: #ff3d00; text-align: center; grid-column: 1/-1; margin-top: 40px;">Failed to load from TMDB. Check your key.</p>`;
            }
        }

        async function searchTMDB() {
            const query = document.getElementById('browseInput').value.trim();
            if (!query) { loadTrending(); return; }
            if (!tmdbKey) { alert("Please enter your TMDB API Key."); return; }

            const resultsContainer = document.getElementById('browseResults');
            resultsContainer.innerHTML = `<p style="color: var(--dim); text-align: center; grid-column: 1/-1; margin-top: 40px;">Searching TMDB...</p>`;
            try {
                const data = await tmdbFetch(`/search/${browseType}?query=${encodeURIComponent(query)}`);
                renderTMDBResults(data.results);
            } catch (e) {
                resultsContainer.innerHTML = `<p style="color: #ff3d00; text-align: center; grid-column: 1/-1; margin-top: 40px;">Search failed.</p>`;
            }
        }

        function renderTMDBResults(items) {
            const grid = document.getElementById('browseResults');
            if (!items || items.length === 0) {
                grid.innerHTML = `<p style="color: var(--dim); text-align: center; grid-column: 1/-1; margin-top: 40px;">No results found.</p>`;
                return;
            }
            grid.innerHTML = items.map(item => {
                const title = item.title || item.name || "Unknown";
                const year = (item.release_date || item.first_air_date || "").split('-')[0] || "N/A";
                const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/150x225?text=No+Poster';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '-';
                return `
                    <div class="movie-card" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(title + ' torrent')}','_blank')" title="Search web">
                        <div class="year-badge">${year}</div>
                        <div class="poster-container"><img src="${poster}" loading="lazy"></div>
                        <div class="movie-info">
                            <h3>${title}</h3>
                            <div style="color:var(--gold); font-size:0.65rem">★ ${rating}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchBrowseType(type) {
            browseType = type;
            document.getElementById('typeMovie').className = `tab-btn ${type === 'movie' ? 'active' : ''}`;
            document.getElementById('typeTv').className = `tab-btn ${type === 'tv' ? 'active' : ''}`;
            const query = document.getElementById('browseInput').value.trim();
            if (query) searchTMDB(); else loadTrending();
        }

        // Initialize App on load
        loadOwnedData();
    </script>
</body>
</html>
