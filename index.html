<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Vault Pro</title>
    <style>
        :root {
            --bg: #0b0b0b; --sidebar: #141414; --card: #181818; --card-hover: #222222;
            --accent: #e50914; --text: #ffffff; --dim: #8c8c8c; --border: #282828; --gold: #f5c518;
        }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 280px; background: var(--sidebar); padding: 24px; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
        .logo { font-size: 1.1rem; font-weight: 800; color: var(--accent); letter-spacing: 3px; margin-bottom: 30px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        
        .nav-menu { display: flex; flex-direction: column; gap: 6px; margin-bottom: 25px; }
        .nav-btn { background: transparent; border: none; color: var(--dim); padding: 12px 14px; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
        .nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .nav-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3); }

        .stats-box { margin-top: auto; font-size: 0.75rem; color: var(--dim); padding: 14px; background: #111; border-radius: 8px; border: 1px solid var(--border); line-height: 1.5; }

        .main-content { flex-grow: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 20px; flex-wrap: wrap; }
        .type-switcher { display: flex; background: var(--sidebar); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
        .type-btn { background: transparent; border: none; color: var(--dim); padding: 8px 18px; font-size: 0.8rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .type-btn.active { background: #333; color: white; }

        .search-container { position: relative; width: 320px; }
        .search-container input { width: 100%; padding: 10px 14px 10px 38px; background: var(--sidebar); border: 1px solid var(--border); color: white; border-radius: 8px; font-size: 0.85rem; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
        .search-container input:focus { border-color: var(--accent); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 0.85rem; }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding-bottom: 40px; }
        
        .movie-card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); position: relative; cursor: pointer; transition: transform 0.25s ease, box-shadow 0.25s ease; }
        .movie-card:hover { transform: translateY(-6px); box-shadow: 0 10px 25px rgba(0,0,0,0.6); border-color: #444; }
        
        /* Shimmer background loading effect for posters */
        .poster-wrapper { width: 100%; aspect-ratio: 2 / 3; background: #1c1c1c; position: relative; overflow: hidden; }
        .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s ease, transform 0.3s ease; opacity: 0; }
        .poster-wrapper img.loaded { opacity: 1; }
        .movie-card:hover .poster-wrapper img { transform: scale(1.05); }
        
        .movie-info { padding: 12px; }
        .movie-info h3 { font-size: 0.8rem; font-weight: 600; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: var(--dim); }
        
        .badge-owned { position: absolute; top: 10px; left: 10px; background: rgba(0, 230, 118, 0.9); color: #000; font-size: 0.6rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; z-index: 2; }

        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; overflow: auto; }
            .sidebar { width: 100%; padding: 15px 20px; height: auto; border-right: none; border-bottom: 1px solid var(--border); box-sizing: border-box; }
            .logo { margin-bottom: 15px; }
            .main-content { padding: 15px; overflow: visible; }
            .search-container { width: 100%; }
            .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(8px); }
        .modal-box { background: #161616; border: 1px solid var(--border); border-radius: 16px; width: 90%; max-width: 650px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        
        .modal-banner { width: 100%; height: 180px; background-size: cover; background-position: center; position: relative; border-bottom: 1px solid var(--border); background-color: #111; }
        .modal-banner::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: linear-gradient(to top, #161616, transparent); }
        .modal-close-abs { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; transition: background 0.2s; }
        .modal-close-abs:hover { background: var(--accent); }

        .modal-body { padding: 20px 25px 25px 25px; overflow-y: auto; flex-grow: 1; }
        .modal-hero { display: flex; gap: 20px; margin-top: -40px; margin-bottom: 20px; flex-wrap: wrap; position: relative; z-index: 2; }
        .modal-poster { width: 110px; height: 165px; border-radius: 8px; object-fit: cover; flex-shrink: 0; border: 2px solid var(--border); background: #222; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .modal-meta-details { flex-grow: 1; padding-top: 40px; }
        .modal-meta-details h1 { font-size: 1.2rem; margin: 0 0 6px 0; }
        .modal-badges { display: flex; gap: 8px; margin-bottom: 10px; font-size: 0.7rem; color: var(--dim); flex-wrap: wrap; }
        .modal-badges span { background: #222; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); }
        .modal-desc { font-size: 0.8rem; line-height: 1.6; color: #ccc; margin-bottom: 20px; }

        .stream-item { background: #222; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .stream-details { font-size: 0.75rem; overflow: hidden; }
        .stream-title { font-weight: 600; color: white; margin-bottom: 4px; }
        .stream-meta { color: var(--dim); font-size: 0.65rem; }
        .btn-action { background: var(--accent); color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; flex-shrink: 0; display: inline-block; }
        .loading-indicator { text-align: center; color: var(--dim); font-size: 0.8rem; grid-column: 1/-1; padding: 20px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">⚡ Movie Vault</div>
        
        <div class="nav-menu">
            <button class="nav-btn active" id="navOwned" onclick="switchTab('owned')">📦 Owned Library</button>
            <button class="nav-btn" id="navBrowse" onclick="switchTab('browse')">🔥 Browse Discovery</button>
        </div>

        <div class="stats-box" id="statsBox">Loading system status...</div>
    </div>

    <div class="main-content" id="mainContainer">
        <div class="top-bar">
            <div class="type-switcher">
                <button class="type-btn active" id="filterMovie" onclick="switchType('movie')">🎬 Movies</button>
                <button class="type-btn" id="filterSeries" onclick="switchType('series')">📺 Series</button>
            </div>

            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search catalog..." oninput="handleSearchInput()">
            </div>
        </div>

        <div id="gridContainer" class="movie-grid"></div>
        <div id="loadingIndicator" class="loading-indicator" style="display:none;">Loading more titles...</div>
    </div>

    <div id="mediaModal" class="modal-overlay" onclick="handleOutsideClick(event)">
        <div class="modal-box" id="modalBox">
            <button class="modal-close-abs" onclick="closeModal()">&times;</button>
            <div id="modalBanner" class="modal-banner"></div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <script>
        let currentTab = 'owned';
        let currentType = 'movie';
        let processedOwned = [];
        let browseCache = { movie: [], series: [] };
        let searchTimeout = null;
        let browseSkip = { movie: 0, series: 0 };
        let isLoadingMore = false;
        let hasMoreItems = true;

        async function init() {
            await loadOwnedDatabase();
            await fetchBrowseCatalog(true);
            renderGrid();
        }

        async function loadOwnedDatabase() {
            try {
                const res = await fetch('database.json');
                const ownedDatabase = await res.json();
                
                const groupedSeries = {};
                let standalone = [];

                Object.keys(ownedDatabase).forEach(id => {
                    const item = ownedDatabase[id];
                    const type = item.meta.type || 'movie';
                    const name = item.meta.name;

                    if (type === 'series' || id.includes(':')) {
                        if (!groupedSeries[name]) {
                            groupedSeries[name] = { id: name, title: name, poster: item.meta.poster, backdrop: item.meta.poster, type: 'series', streams: [], isOwned: true, description: "Owned series collection stored locally in your vault database." };
                        }
                        if (item.streams) item.streams.forEach(s => groupedSeries[name].streams.push(s));
                    } else {
                        standalone.push({ id: id, title: name, poster: item.meta.poster, backdrop: item.meta.poster, type: 'movie', streams: item.streams || [], isOwned: true, description: "Owned movie item stored locally in your vault database." });
                    }
                });

                processedOwned = [...standalone, ...Object.values(groupedSeries)];
                document.getElementById('statsBox').innerHTML = `<b>Owned Vault:</b> ${processedOwned.length} items loaded`;
            } catch (e) {
                document.getElementById('statsBox').innerHTML = `<b>Vault:</b> database.json not found`;
            }
        }

        async function fetchBrowseCatalog(reset = false, query = '') {
            if (isLoadingMore) return;
            isLoadingMore = true;

            if (reset) {
                browseSkip[currentType] = 0;
                browseCache[currentType] = [];
                hasMoreItems = true;
            }

            if (!hasMoreItems && !reset) {
                isLoadingMore = false;
                return;
            }

            document.getElementById('loadingIndicator').style.display = 'block';

            try {
                let url = `https://v3-cinemeta.strem.io/catalog/${currentType}/top/skip=${browseSkip[currentType]}.json`;
                if (query.trim().length > 0) {
                    url = `https://v3-cinemeta.strem.io/catalog/${currentType}/top/search=${encodeURIComponent(query)}.json`;
                }

                const res = await fetch(url);
                const data = await res.json();
                const metas = data.metas || [];

                const formatted = metas.map(m => ({
                    id: m.id, 
                    title: m.name, 
                    poster: m.poster, 
                    backdrop: m.background || m.poster,
                    type: currentType, 
                    year: m.year || '', 
                    genre: (m.genres || []).join(', '),
                    description: m.description || 'No synopsis available for this title.',
                    streams: [], 
                    isOwned: false
                }));

                if (reset) {
                    browseCache[currentType] = formatted;
                } else {
                    browseCache[currentType] = [...browseCache[currentType], ...formatted];
                }

                browseSkip[currentType] += metas.length;
                if (metas.length === 0) hasMoreItems = false;
                renderGrid();
            } catch (e) {
                console.error("Catalog fetch error:", e);
            }

            isLoadingMore = false;
            document.getElementById('loadingIndicator').style.display = 'none';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('navOwned').className = `nav-btn ${tab === 'owned' ? 'active' : ''}`;
            document.getElementById('navBrowse').className = `nav-btn ${tab === 'browse' ? 'active' : ''}`;
            renderGrid();
        }

        function switchType(type) {
            currentType = type;
            document.getElementById('filterMovie').className = `type-btn ${type === 'movie' ? 'active' : ''}`;
            document.getElementById('filterSeries').className = `type-btn ${type === 'series' ? 'active' : ''}`;
            
            if (currentTab === 'browse' && browseCache[currentType].length === 0) {
                fetchBrowseCatalog(true);
            } else {
                renderGrid();
            }
        }

        function handleSearchInput() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('searchInput').value;

            searchTimeout = setTimeout(() => {
                if (currentTab === 'browse') {
                    fetchBrowseCatalog(true, query);
                } else {
                    renderGrid();
                }
            }, 350);
        }

        document.getElementById('mainContainer').addEventListener('scroll', function() {
            if (currentTab === 'browse' && !isLoadingMore) {
                const container = this;
                if (container.scrollTop + container.clientHeight >= container.scrollHeight - 250) {
                    const query = document.getElementById('searchInput').value;
                    fetchBrowseCatalog(false, query);
                }
            }
        });

        function renderGrid() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let dataset = [];

            if (currentTab === 'owned') {
                dataset = processedOwned.filter(m => m.type === currentType && m.title.toLowerCase().includes(query));
            } else {
                dataset = (browseCache[currentType] || []).filter(m => m.title.toLowerCase().includes(query));
            }

            const grid = document.getElementById('gridContainer');
            if (dataset.length === 0) {
                grid.innerHTML = `<p style="color:var(--dim); grid-column:1/-1; text-align:center; margin-top:50px; font-size:0.85rem;">No ${currentType}s found.</p>`;
                return;
            }

            grid.innerHTML = dataset.map(item => `
                <div class="movie-card" onclick="openDetailsModal('${item.id}', ${item.isOwned})">
                    ${item.isOwned ? '<div class="badge-owned">Owned</div>' : ''}
                    <div class="poster-wrapper">
                        <img src="${item.poster && item.poster !== 'N/A' ? item.poster : 'https://via.placeholder.com/150x225?text=No+Poster'}" 
                             loading="lazy" 
                             onload="this.classList.add('loaded')">
                    </div>
                    <div class="movie-info">
                        <h3>${item.title}</h3>
                        <div class="movie-meta-row">
                            <span>${item.year || (item.streams ? item.streams.length + ' stream(s)' : '')}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openDetailsModal(id, isOwned) {
            let item;
            if (isOwned) {
                item = processedOwned.find(m => m.id === id);
            } else {
                item = browseCache[currentType].find(m => m.id === id);
            }

            if (!item) return;

            document.getElementById('modalBanner').style.backgroundImage = `url('${item.backdrop || item.poster}')`;

            let streamsHTML = '';
            if (isOwned && item.streams.length > 0) {
                streamsHTML = `<h3 style="font-size:0.9rem; margin: 15px 0 10px 0; color:var(--accent);">Available Vault Streams</h3>` + 
                    item.streams.map(s => `
                        <div class="stream-item">
                            <div class="stream-details">
                                <div class="stream-title">${s.title}</div>
                                <div class="stream-meta">Source: ${s.name} | File: ${s.filename}</div>
                            </div>
                            <a href="${s.url}" target="_blank" class="btn-action">Play / Open</a>
                        </div>
                    `).join('');
            } else {
                streamsHTML = `
                    <div style="background:#222; padding:15px; border-radius:8px; text-align:center; margin-top:15px; border:1px solid var(--border);">
                        <p style="font-size:0.8rem; color:var(--dim); margin-bottom:10px;">Not currently in your owned vault. Download manager integration coming up next!</p>
                        <a href="https://www.google.com/search?q=${encodeURIComponent(item.title + ' torrent')}" target="_blank" class="btn-action">Search Web Releases</a>
                    </div>
                `;
            }

            document.getElementById('modalBody').innerHTML = `
                <div class="modal-hero">
                    <img class="modal-poster" src="${item.poster || 'https://via.placeholder.com/110x165?text=No+Poster'}">
                    <div class="modal-meta-details">
                        <h1>${item.title}</h1>
                        <div class="modal-badges">
                            ${item.year ? `<span>📅 ${item.year}</span>` : ''}
                            ${item.genre ? `<span>🎭 ${item.genre}</span>` : ''}
                        </div>
                    </div>
                </div>
                <p class="modal-desc">${item.description}</p>
                ${streamsHTML}
            `;

            document.getElementById('mediaModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('mediaModal').style.display = 'none';
        }

        function handleOutsideClick(event) {
            const modalBox = document.getElementById('modalBox');
            if (!modalBox.contains(event.target)) {
                closeModal();
            }
        }

        init();
    </script>
</body>
</html>
