<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Vault Pro</title>
    <style>
        :root {
            --bg: #0b0b0b; --sidebar: #141414; --card: #181818; --card-hover: #222222;
            --accent: #e50914; --text: #ffffff; --dim: #8c8c8c; --border: #282828; --gold: #f5c518;
        }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styling */
        .sidebar { width: 280px; background: var(--sidebar); padding: 24px; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
        .logo { font-size: 1.1rem; font-weight: 800; color: var(--accent); letter-spacing: 3px; margin-bottom: 30px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        
        .nav-menu { display: flex; flex-direction: column; gap: 6px; margin-bottom: 25px; }
        .nav-btn { background: transparent; border: none; color: var(--dim); padding: 12px 14px; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
        .nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .nav-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3); }

        .stats-box { margin-top: auto; font-size: 0.75rem; color: var(--dim); padding: 14px; background: #111; border-radius: 8px; border: 1px solid var(--border); line-height: 1.5; }

        /* Main Content Layout */
        .main-content { flex-grow: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 20px; flex-wrap: wrap; }
        .type-switcher { display: flex; background: var(--sidebar); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
        .type-btn { background: transparent; border: none; color: var(--dim); padding: 8px 18px; font-size: 0.8rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .type-btn.active { background: #333; color: white; }

        .search-container { position: relative; width: 300px; }
        .search-container input { width: 100%; padding: 10px 14px 10px 38px; background: var(--sidebar); border: 1px solid var(--border); color: white; border-radius: 8px; font-size: 0.85rem; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
        .search-container input:focus { border-color: var(--accent); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 0.85rem; }

        /* Media Grid */
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding-bottom: 40px; }
        
        .movie-card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); position: relative; cursor: pointer; transition: transform 0.25s ease, box-shadow 0.25s ease; }
        .movie-card:hover { transform: translateY(-6px); box-shadow: 0 10px 25px rgba(0,0,0,0.6); border-color: #444; }
        .poster-wrapper { width: 100%; aspect-ratio: 2 / 3; background: #141414; position: relative; overflow: hidden; }
        .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .movie-card:hover .poster-wrapper img { transform: scale(1.05); }
        
        .movie-info { padding: 12px; }
        .movie-info h3 { font-size: 0.8rem; font-weight: 600; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: var(--dim); }
        
        .badge-owned { position: absolute; top: 10px; left: 10px; background: rgba(0, 230, 118, 0.9); color: #000; font-size: 0.6rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); z-index: 2; }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; overflow: auto; }
            .sidebar { width: 100%; padding: 15px 20px; height: auto; border-right: none; border-bottom: 1px solid var(--border); box-sizing: border-box; }
            .logo { margin-bottom: 15px; }
            .main-content { padding: 15px; overflow: visible; }
            .search-container { width: 100%; }
            .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }

        /* Modern Glass Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(8px); }
        .modal-box { background: #161616; border: 1px solid var(--border); border-radius: 16px; width: 90%; max-width: 550px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.7); animation: modalIn 0.25s ease; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #1f1f1f; }
        .modal-header h2 { font-size: 1rem; font-weight: 700; margin: 0; color: white; }
        .modal-close { background: none; border: none; color: var(--dim); font-size: 1.4rem; cursor: pointer; transition: color 0.2s; }
        .modal-close:hover { color: white; }
        
        .modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .stream-card { background: #222; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .stream-details { font-size: 0.75rem; overflow: hidden; }
        .stream-title { font-weight: 600; color: white; margin-bottom: 4px; }
        .stream-meta { color: var(--dim); font-size: 0.65rem; }
        .btn-action { background: var(--accent); color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; flex-shrink: 0; display: inline-block; transition: opacity 0.2s; }
        .btn-action:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">⚡ Movie Vault</div>
        
        <div class="nav-menu">
            <button class="nav-btn active" id="navOwned" onclick="switchTab('owned')">📦 Owned Library</button>
            <button class="nav-btn" id="navBrowse" onclick="switchTab('browse')">🔥 Browse Discovery</button>
        </div>

        <div class="stats-box" id="statsBox">
            Loading system status...
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="type-switcher">
                <button class="type-btn active" id="filterMovie" onclick="switchType('movie')">🎬 Movies</button>
                <button class="type-btn" id="filterSeries" onclick="switchType('series')">📺 Series</button>
            </div>

            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search catalog..." onkeyup="renderGrid()">
            </div>
        </div>

        <div id="gridContainer" class="movie-grid">
            <!-- Dynamic cards render here -->
        </div>
    </div>

    <!-- Interactive Item Modal -->
    <div id="mediaModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle">Title Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody" class="modal-body">
                <!-- Streams or details load here -->
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'owned'; // 'owned' or 'browse'
        let currentType = 'movie'; // 'movie' or 'series'
        let ownedData = {};
        let processedOwned = [];
        let browseCache = { movie: [], series: [] };

        async function init() {
            await loadOwnedDatabase();
            await loadBrowseCatalog();
            renderGrid();
        }

        async function loadOwnedDatabase() {
            try {
                const res = await fetch('database.json');
                ownedDatabase = await res.json();
                
                const groupedSeries = {};
                let standalone = [];

                Object.keys(ownedDatabase).forEach(id => {
                    const item = ownedDatabase[id];
                    const type = item.meta.type || 'movie';
                    const name = item.meta.name;

                    if (type === 'series' || id.includes(':')) {
                        if (!groupedSeries[name]) {
                            groupedSeries[name] = { id: name, title: name, poster: item.meta.poster, type: 'series', streams: [], isOwned: true };
                        }
                        if (item.streams) item.streams.forEach(s => groupedSeries[name].streams.push(s));
                    } else {
                        standalone.push({ id: id, title: name, poster: item.meta.poster, type: 'movie', streams: item.streams || [], isOwned: true });
                    }
                });

                processedOwned = [...standalone, ...Object.values(groupedSeries)];
                document.getElementById('statsBox').innerHTML = `<b>Owned Vault:</b> ${processedOwned.length} items loaded`;
            } catch (e) {
                console.error(e);
                document.getElementById('statsBox').innerHTML = `<b>Vault:</b> database.json not found`;
            }
        }

        async function loadBrowseCatalog() {
            try {
                // Fetching from Stremio Cinemeta public catalog (No API key, CORS enabled)
                const [movieRes, seriesRes] = await Promise.all([
                    fetch('https://v3-cinemeta.strem.io/catalog/movie/top.json'),
                    fetch('https://v3-cinemeta.strem.io/catalog/series/top.json')
                ]);
                
                const movieData = await movieRes.json();
                const seriesData = await seriesRes.json();

                browseCache.movie = (movieData.metas || []).map(m => ({
                    id: m.id, title: m.name, poster: m.poster, type: 'movie', year: m.year || '', streams: [], isOwned: false
                }));

                browseCache.series = (seriesData.metas || []).map(m => ({
                    id: m.id, title: m.name, poster: m.poster, type: 'series', year: m.year || '', streams: [], isOwned: false
                }));
            } catch (e) {
                console.error("Browse catalog load failed:", e);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('navOwned').className = `nav-btn ${tab === 'owned' ? 'active' : ''}`;
            document.getElementById('navBrowse').className = `nav-btn ${tab === 'browse' ? 'active' : ''}`;
            renderGrid();
        }

        function switchType(type) {
            currentType = type;
            document.getElementById('filterMovie').className = `type-btn ${type === 'movie' ? 'active' : ''}`;
            document.getElementById('filterSeries').className = `type-btn ${type === 'series' ? 'active' : ''}`;
            renderGrid();
        }

        function renderGrid() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let dataset = [];

            if (currentTab === 'owned') {
                dataset = processedOwned.filter(m => m.type === currentType && m.title.toLowerCase().includes(query));
            } else {
                const catalog = browseCache[currentType] || [];
                dataset = catalog.filter(m => m.title.toLowerCase().includes(query));
            }

            const grid = document.getElementById('gridContainer');
            if (dataset.length === 0) {
                grid.innerHTML = `<p style="color:var(--dim); grid-column:1/-1; text-align:center; margin-top:50px; font-size:0.85rem;">No ${currentType}s found.</p>`;
                return;
            }

            grid.innerHTML = dataset.map(item => `
                <div class="movie-card" onclick="handleCardClick('${item.id}', ${item.isOwned})">
                    ${item.isOwned ? '<div class="badge-owned">Owned</div>' : ''}
                    <div class="poster-wrapper">
                        <img src="${item.poster && item.poster !== 'N/A' ? item.poster : 'https://via.placeholder.com/150x225?text=No+Poster'}" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <h3>${item.title}</h3>
                        <div class="movie-meta-row">
                            <span>${item.year || (item.streams ? item.streams.length + ' stream(s)' : '')}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function handleCardClick(id, isOwned) {
            const modal = document.getElementById('mediaModal');
            const modalBody = document.getElementById('modalBody');
            const modalTitle = document.getElementById('modalTitle');

            if (isOwned) {
                const item = processedOwned.find(m => m.id === id);
                if (!item) return;
                modalTitle.innerText = item.title;
                modalBody.innerHTML = item.streams.map(s => `
                    <div class="stream-item">
                        <div class="stream-details">
                            <div class="stream-title">${s.title}</div>
                            <div class="stream-meta">Source: ${s.name} | File: ${s.filename}</div>
                        </div>
                        <a href="${s.url}" target="_blank" class="btn-action">Play / Open</a>
                    </div>
                `).join('');
            } else {
                // Browse item click placeholder (ready for release search integration next!)
                const item = browseCache[currentType].find(m => m.id === id);
                if (!item) return;
                modalTitle.innerText = item.title;
                modalBody.innerHTML = `
                    <div style="text-align:center; padding:20px; color:var(--dim);">
                        <p style="margin-bottom:15px; font-size:0.85rem;">Browse mode selection. Download grabber & release finder coming up next!</p>
                        <a href="https://www.google.com/search?q=${encodeURIComponent(item.title + ' torrent')}" target="_blank" class="btn-action">Search Web</a>
                    </div>
                `;
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('mediaModal').style.display = 'none';
        }

        // Start App
        init();
    </script>
</body>
</html>
